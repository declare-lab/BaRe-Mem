# The reference rows: frozen Qwen3-4B, its own record, whole capability-supported and capability-challenging streams.
base: ../base.yaml
name: main
steps: [features, record, evaluate, table]
central: [q3_4b]                 # the model that answers (and whose own hidden states address the record)
datasets: [capability_supported, capability_challenging]             # registered in configs/datasets/
eval_conditions: [tilt, peers, solo, swap]
table:
  rows: models
  deltas: [[tilt, peers], [tilt, solo], [peers, solo]]
