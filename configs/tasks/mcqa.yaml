# A task type. Multiple choice (capability-challenging stream): right when the chosen option's label matches the gold label.
grader: mcqa                        # the rule that extracts and verifies an answer (feedback_state/tasks.py, GRADERS)
agreement: canonical                # when two answers are the same answer in a vote (feedback_state/answer_groups.py)
instruction: "Choose the correct option. End with a line of the form 'Final answer: (<letter>)'."
max_tokens: 96                    # a peer's answer budget
misleading_max_tokens: 256         # a misleading answer argues for its conclusion
